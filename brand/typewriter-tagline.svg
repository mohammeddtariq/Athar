<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" width="600" height="40">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Inter:wght@600&amp;display=swap');
    
    .text-en {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      font-style: normal;
      font-weight: 600;
      fill: #C9D8B4;
      text-anchor: middle;
      opacity: 0;
      animation: cycleEnglish 8s infinite ease-in-out;
    }
    
    .text-ar {
      font-family: 'Amiri', 'Traditional Arabic', serif;
      font-size: 21px;
      font-style: normal;
      font-weight: 700;
      fill: #C9D8B4;
      text-anchor: middle;
      opacity: 0;
      animation: cycleArabic 8s infinite ease-in-out;
    }
    
    @keyframes cycleEnglish {
      0%, 4% { opacity: 0; transform: translateY(3px); }
      10%, 44% { opacity: 1; transform: translateY(0px); }
      48%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    
    @keyframes cycleArabic {
      0%, 48% { opacity: 0; transform: translateY(3px); }
      54%, 88% { opacity: 1; transform: translateY(0px); }
      94%, 100% { opacity: 0; transform: translateY(-3px); }
    }
  </style>
  <g transform="translate(300, 25)">
    <text class="text-en">Your Muslim companion app</text>
    <text class="text-ar">رفيقك المسلم</text>
  </g>
</svg>
